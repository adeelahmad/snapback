version: 2
project_name: snapback

builds:
  - id: snapback
    main: ./cmd/snapback
    binary: snapback
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - linux_arm_7
      - linux_mips_softfloat
      - linux_mipsle_softfloat
    ldflags:
      - -X github.com/adeelahmad/snapback/internal/version.Version={{ .Version }}
      - -X github.com/adeelahmad/snapback/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/adeelahmad/snapback/internal/version.Target={{ .Os }}/{{ .Arch }}
    goarm:
      - "7"
    gomips:
      - softfloat

universal_binaries:
  - id: snapback_universal
    ids:
      - snapback
    replace: false
    name_template: snapback

archives:
  - id: snapback
    ids:
      - snapback
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if or (eq .Arch "arm") (eq .Arch "mips") (eq .Arch "mipsle") }}_unverified{{ end }}'
    files:
      - LICENSE
      - NOTICE
  - id: snapback_universal
    ids:
      - snapback_universal
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_universal'
    files:
      - LICENSE
      - NOTICE

  - id: snapback_all
    ids:
      - snapback
      - snapback_universal
    meta: true
    formats: [tar.gz]
    wrap_in_directory: false
    name_template: '{{ .ProjectName }}_all'
    files:
      - src: LICENSE
        dst: LICENSE
      - src: NOTICE
        dst: NOTICE
      - src: dist/snapback_darwin_amd64_v1/snapback
        dst: darwin_amd64/snapback
      - src: dist/snapback_darwin_arm64_v8.0/snapback
        dst: darwin_arm64/snapback
      - src: dist/snapback_universal_darwin_all/snapback
        dst: darwin_all/snapback
      - src: dist/snapback_linux_amd64_v1/snapback
        dst: linux_amd64/snapback
      - src: dist/snapback_linux_arm64_v8.0/snapback
        dst: linux_arm64/snapback
      - src: dist/snapback_linux_arm_7/snapback
        dst: linux_armv7/snapback
      - src: dist/snapback_linux_mips_softfloat/snapback
        dst: linux_mips_softfloat/snapback
      - src: dist/snapback_linux_mipsle_softfloat/snapback
        dst: linux_mipsle_softfloat/snapback

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

dockers:
  - id: snapback_linux_amd64
    ids:
      - snapback
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --build-arg=RESTIC_VERSION=0.18.0
      - --build-arg=RESTIC_SHA256=98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
  - id: snapback_linux_arm64
    ids:
      - snapback
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --build-arg=RESTIC_VERSION=0.18.0
      - --build-arg=RESTIC_SHA256=ce18179c25dc5f2e33e3c233ba1e580f9de1a4566d2977e8d9600210363ec209

docker_manifests:
  - name_template: ghcr.io/adeelahmad/snapback:{{ .Version }}
    image_templates:
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-amd64
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-arm64
  - name_template: ghcr.io/adeelahmad/snapback:latest
    image_templates:
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-amd64
      - ghcr.io/adeelahmad/snapback:{{ .Version }}-arm64

release:
  mode: append
  footer: |
    Targets linux/arm, linux/mips and linux/mipsle are unverified: they are
    cross-compiled but not tested on real hardware. Their assets carry the
    `_unverified` suffix.

    The macOS (darwin) binaries are a self-contained executable; their linkage and runtime are not verified.

    Verify downloads against checksums.txt; checksums.txt is signed keylessly
    with cosign (checksums.txt.sig, checksums.txt.pem).

changelog:
  disable: true
