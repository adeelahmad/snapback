name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          test -z "$(gofmt -l .)"
          test -z "$(goimports -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "total coverage: ${total}%"
          if awk -v t="$total" 'BEGIN {exit !(t < 80)}'; then
            echo "coverage ${total}% is below 80%"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, label: ''}
          - {goos: linux, goarch: arm64, label: ''}
          - {goos: darwin, goarch: amd64, label: ''}
          - {goos: darwin, goarch: arm64, label: ''}
          - {goos: linux, goarch: arm, label: (unverified)}
          - {goos: linux, goarch: mips, label: (unverified)}
          - {goos: linux, goarch: mipsle, label: (unverified)}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o snapback ./cmd/snapback

      - name: Static linkage evidence
        if: matrix.goos == 'linux'
        run: file snapback
