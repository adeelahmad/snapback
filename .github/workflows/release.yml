name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semrel.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.0
          dry_run: ${{ inputs.dry_run == true }}
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Adeel Ahmad
          GIT_AUTHOR_EMAIL: adeelahmad99@gmail.com
          GIT_COMMITTER_NAME: Adeel Ahmad
          GIT_COMMITTER_EMAIL: adeelahmad99@gmail.com

  goreleaser:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: v0.1 exit criterion (full Linux evidence)
        run: go test ./test/reports/ -run TestV01ExitCriterionMet -count=1 -v
        env:
          SNAPBACK_RELEASE_GATE: "1"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Linux linkage
        run: |
          set -eu
          : > linkage-linux.txt
          for bin in dist/snapback_linux_amd64*/snapback dist/snapback_linux_arm64*/snapback; do
            file "$bin" | tee -a linkage-linux.txt
            ldd "$bin" >> linkage-linux.txt 2>&1 || true
            file "$bin" | grep -q "statically linked"
            ldd "$bin" 2>&1 | grep -q "not a dynamic executable"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linkage-linux
          path: linkage-linux.txt
