name: Feature request
description: Something snapback should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: The restore you can't do today, description: "Describe the situation, not the solution."}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: What you'd like snapback to do}
  - type: textarea
    id: workaround
    attributes: {label: How you handle it now}
